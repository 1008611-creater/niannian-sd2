name: niannian-ai-web CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: niannian-ai-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: niannian
          POSTGRES_PASSWORD: niannian
          POSTGRES_DB: niannian_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # 关键：CI 必须显式提供 DATABASE_URL，确保走 Postgres 而非 sql.js 兜底（风险 R2/R3）
      DATABASE_URL: postgres://niannian:niannian@127.0.0.1:5432/niannian_ci
      DATABASE_SSL: "false"
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: niannian
      POSTGRES_PASSWORD: niannian
      POSTGRES_DB: niannian_ci
      AUTH_COOKIE_SECURE: "false"
      APP_ORIGIN: http://127.0.0.1:3999
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Env keys check
        run: bash scripts/check-env.sh --keys-only --skip-missing

      - name: Typecheck
        run: npm run typecheck

      - name: Lint（当前 lint 仍为 tsc --noEmit，ESLint 引入后自动生效）
        run: npm run lint

      - name: Unit + contract tests
        run: npm run test

      - name: Secret scan
        run: bash scripts/secret-scan.sh

      - name: Production build
        run: npm run build

      - name: Smoke（构建产物可启动 + health + 鉴权 401）
        run: bash scripts/smoke.sh
